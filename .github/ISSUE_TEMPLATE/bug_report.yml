name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please don't include personal details (your real resume, phone number, email…).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a resume with the Modern ATS template
        2. …
    validations:
      required: true
  - type: dropdown
    id: template
    attributes:
      label: Template
      options: [Classic Sidebar, Modern ATS, Both, Not related to a template]
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: e.g. Chrome 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or backup file
      description: A screenshot, or a backup file (Export backup) with personal details removed, helps a lot.
