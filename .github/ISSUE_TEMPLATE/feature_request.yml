name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could the app help? Mockups or examples are welcome.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The idea keeps resume data on the user's device (no uploads, tracking or analytics).
